name: Refresh profile

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-refresh.yml"]

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  summary-cards:
    name: Profile summary cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Light theme
        uses: vn7n24fzkq/github-profile-summary-cards@v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github
          TIME_ZONE: Asia/Kolkata
          ANIMATION: fade

      - name: Dark theme
        uses: vn7n24fzkq/github-profile-summary-cards@v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github_dark
          TIME_ZONE: Asia/Kolkata
          ANIMATION: fade

  blog-posts:
    name: Latest DEV posts
    needs: summary-cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          feed_list: "https://dev.to/feed/sagary2j"
          max_post_count: 5
          commit_message: "Update latest DEV posts"

  snake:
    name: Contribution snake
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
