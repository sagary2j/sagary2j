name: Refresh profile

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile-refresh.yml"]

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  # main requires reviewed pull requests, so generated images are published
  # to the unprotected "output" branch and referenced from the README.
  generated-images:
    name: Stats cards and contribution snake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Summary cards (light)
        uses: vn7n24fzkq/github-profile-summary-cards@v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github
          TIME_ZONE: Asia/Kolkata
          ANIMATION: fade
          AUTO_PUSH: false

      - run: mkdir -p dist/cards && mv profile-summary-card-output/github dist/cards/

      - name: Summary cards (dark)
        uses: vn7n24fzkq/github-profile-summary-cards@v0.13.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: github_dark
          TIME_ZONE: Asia/Kolkata
          ANIMATION: fade
          AUTO_PUSH: false

      - run: mv profile-summary-card-output/github_dark dist/cards/ && find dist -type f

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
